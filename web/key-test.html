<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virelia key test</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
  input, button { display: block; width: 100%; margin: 8px 0; padding: 10px; font-size: 15px; box-sizing: border-box; }
  button { cursor: pointer; }
  .hidden { display: none; }
  #log { white-space: pre-wrap; background: #f3f3f3; padding: 10px; font-size: 13px; }
</style>
</head>
<body>
<h2>Platform admin login</h2>

<div id="step1">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Log in</button>
</div>

<div id="step2" class="hidden">
  <input id="code" placeholder="6-digit code from the app">
  <button id="codeBtn">Send code</button>
</div>

<div id="step3" class="hidden">
  <p>You are logged in.</p>
  <button id="addKeyBtn">Add a backup key</button>
</div>

<div id="log"></div>

<script>
const API = "/api/v1";
let challenge = "";
let access = "";

function show(id) {
  ["step1", "step2", "step3"].forEach(function (s) {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
}

function log(msg) {
  document.getElementById("log").textContent = msg;
}

async function post(path, body, headers) {
  const res = await fetch(API + path, {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" }, headers || {}),
    body: body ? JSON.stringify(body) : null,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

// Base64url text <-> bytes, which the key API needs.
function toBytes(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
}

function toText(buf) {
  let s = "";
  new Uint8Array(buf).forEach(function (b) { s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function fixIds(list) {
  return (list || []).map(function (c) {
    return Object.assign({}, c, { id: toBytes(c.id) });
  });
}

function loggedIn(tokens) {
  access = tokens.access_token;
  show("step3");
  log("Logged in.");
}

document.getElementById("loginBtn").onclick = async function () {
  try {
    const r = await post("/auth/staff/login", {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    });
    challenge = r.challenge_token;

    if (r.use_security_key) {
      if (r.has_key) await keyLogin();
      else await addKey("/auth/staff/key/setup", { "X-Challenge-Token": challenge }, true);
      return;
    }

    show("step2");
    log(r.setup_required
      ? "First login. Add this to your authenticator app:\n" + r.totp_link
      : "Enter the code from your authenticator app.");
  } catch (e) { log("Error: " + e.message); }
};

document.getElementById("codeBtn").onclick = async function () {
  try {
    const tokens = await post("/auth/staff/verify-2fa", {
      challenge_token: challenge,
      code: document.getElementById("code").value,
    });
    loggedIn(tokens);
  } catch (e) { log("Error: " + e.message); }
};

async function keyLogin() {
  const h = { "X-Challenge-Token": challenge };
  const opts = await post("/auth/staff/key/begin", null, h);
  const pk = opts.publicKey;

  pk.challenge = toBytes(pk.challenge);
  pk.allowCredentials = fixIds(pk.allowCredentials);

  log("Touch your key or use Windows Hello...");
  const cred = await navigator.credentials.get({ publicKey: pk });

  const tokens = await post("/auth/staff/key/finish", {
    id: cred.id,
    rawId: toText(cred.rawId),
    type: cred.type,
    response: {
      clientDataJSON: toText(cred.response.clientDataJSON),
      authenticatorData: toText(cred.response.authenticatorData),
      signature: toText(cred.response.signature),
      userHandle: cred.response.userHandle ? toText(cred.response.userHandle) : null,
    },
  }, h);

  loggedIn(tokens);
}

// addKey registers a key. On first login it uses the
// step-1 token and logs you in; later it adds a backup.
async function addKey(path, h, firstTime) {
  const opts = await post(path + "/begin", null, h);
  const pk = opts.publicKey;

  pk.challenge = toBytes(pk.challenge);
  pk.user.id = toBytes(pk.user.id);
  pk.excludeCredentials = fixIds(pk.excludeCredentials);

  log("Touch your key or use Windows Hello...");
  const cred = await navigator.credentials.create({ publicKey: pk });

  const result = await post(path + "/finish", {
    id: cred.id,
    rawId: toText(cred.rawId),
    type: cred.type,
    response: {
      clientDataJSON: toText(cred.response.clientDataJSON),
      attestationObject: toText(cred.response.attestationObject),
    },
  }, h);

  if (firstTime) loggedIn(result);
  log("Security key saved. Next time, you log in with it.");
}

document.getElementById("addKeyBtn").onclick = async function () {
  try {
    await addKey("/auth/keys/register", { Authorization: "Bearer " + access }, false);
  } catch (e) { log("Error: " + e.message); }
};
</script>
</body>
</html>
